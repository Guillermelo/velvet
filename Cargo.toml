[workspace]
members = ["crates/core", "crates/audio", "crates/ai", "crates/cli", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-TBD"

[workspace.dependencies]
velvet-core = { path = "crates/core" }
velvet-audio = { path = "crates/audio" }
velvet-ai = { path = "crates/ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tempfile = "3"

